<title>Reset Password · Slottley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Lato:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #153529;
    --bg: #F8F6F3;
    --field-bg: #364C7108;
    --field-border: #364C710F;
    --black: #111827;
    --sub-text: #8A8A8A;
    --placeholder: #999999;
    --red: #D00010;
    --green: #00BE06;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--primary);
    font-family: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .page {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--primary);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .header {
    padding: 40px 24px 48px;
    text-align: center;
  }
  .logo-box {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    background: #ffffff;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-box img {
    width: 46px;
    height: 46px;
  }
  .wordmark {
    margin-top: 14px;
    color: #ffffff;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 28px;
  }
  .heading {
    margin-top: 10px;
    color: #ffffff;
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 22px;
  }
  .card {
    background: var(--bg);
    border-radius: 28px;
    padding: 28px 24px 40px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    margin-bottom: 8px;
    color: var(--black);
    font-size: 14px;
    font-weight: 400;
  }
  .input-row {
    height: 52px;
    display: flex;
    align-items: center;
    border-radius: 12px;
    padding: 0 16px;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    transition: border-color 0.15s ease;
  }
  .input-row.focused { border-color: var(--primary); }
  .input-row input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px;
    font-family: 'Lato', sans-serif;
    color: var(--black);
    min-width: 0;
  }
  .input-row input::placeholder { color: var(--placeholder); }
  .eye-toggle {
    border: none;
    background: none;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    color: var(--sub-text);
  }
  .eye-toggle svg { width: 20px; height: 20px; }
  .btn {
    width: 100%;
    height: 56px;
    border-radius: 30px;
    border: none;
    background: var(--primary);
    color: #ffffff;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Lato', sans-serif;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s ease;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn:not(:disabled):hover { opacity: 0.92; }
  .message {
    margin-top: 14px;
    font-size: 13.5px;
    line-height: 1.4;
    text-align: center;
  }
  .message.error { color: var(--red); }
  .message.info { color: var(--sub-text); }
  .status-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 24px 8px;
  }
  .status-icon {
    width: 64px;
    height: 64px;
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    font-size: 32px;
  }
  .status-icon.success { background: #00BE061A; color: var(--green); }
  .status-icon.error { background: #D000101A; color: var(--red); }
  .status-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--black);
    margin-bottom: 8px;
  }
  .status-body {
    font-size: 14.5px;
    color: var(--sub-text);
    line-height: 1.5;
    max-width: 320px;
  }
  .spinner {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.4);
    border-top-color: #ffffff;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://vsxdiyxkpbowkleikjmp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzeGRpeXhrcGJvd2tsZWlram1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMTYwODYsImV4cCI6MjEwMjc5MjA4Nn0.7w0TpoqjD4zCzKbFCDeoZrCtxexAzXnB1i5LJQcL_Do';

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        flowType: 'implicit',
        detectSessionInUrl: true,
        persistSession: false,
      },
    });

    const views = {
      verifying: document.getElementById('verifying-view'),
      invalid: document.getElementById('invalid-view'),
      form: document.getElementById('reset-form'),
      success: document.getElementById('success-view'),
    };

    function showView(name) {
      Object.values(views).forEach(v => v.classList.add('hidden'));
      views[name].classList.remove('hidden');
    }

    // If Supabase redirected back with an explicit error (e.g. expired/used
    // link), it's in the hash as error/error_description — show that
    // instead of waiting for an auth event that will never fire.
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    if (hashParams.get('error')) {
      showView('invalid');
    } else {
      // detectSessionInUrl parses the recovery hash on client creation and
      // fires this with a real session if the link was valid.
      client.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
          showView('form');
        }
      });

      // Fallback: if nothing fired within a few seconds (no recovery hash
      // at all, e.g. someone opened this page directly), treat as invalid.
      setTimeout(() => {
        if (!views.verifying.classList.contains('hidden')) {
          showView('invalid');
        }
      }, 4000);
    }

    // Password visibility toggles.
    document.querySelectorAll('.eye-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    // Focus ring on the input rows (mirrors the app's CustomTextInput).
    ['password', 'confirm-password'].forEach(id => {
      const input = document.getElementById(id);
      const row = document.getElementById(id + '-row');
      input.addEventListener('focus', () => row.classList.add('focused'));
      input.addEventListener('blur', () => row.classList.remove('focused'));
    });

    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const formMessage = document.getElementById('form-message');

    function showFormError(text) {
      formMessage.textContent = text;
      formMessage.classList.remove('hidden');
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      formMessage.classList.add('hidden');

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password.length < 6) {
        showFormError('Password must be at least 6 characters.');
        return;
      }
      if (password !== confirmPassword) {
        showFormError('Please make sure both passwords are the same.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Updating…';

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
        showFormError(error.message || 'Could not update your password. Please try again.');
        return;
      }

      showView('success');
    });
  </script>
</body>
